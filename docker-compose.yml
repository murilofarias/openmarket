version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: openmarket-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: openmarket
      POSTGRES_USER: openmarket_user
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmarket_user -d openmarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openmarket-app
    ports:
      - "8080:8080"
      - "5005:5005"  # ⭐ Expose debug port
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev

volumes:
  pgdata: