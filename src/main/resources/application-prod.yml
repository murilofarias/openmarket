spring:
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.example.openmarket: INFO
    com.example.openmarket.controller.exceptionHandler: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: ""  # Disable console logging in production
  file:
    name: /var/log/openmarket/openmarket.log
    max-size: 50MB
    max-history: 90

# Production storage settings
app:
  storage:
    upload-dir: /var/lib/openmarket/uploads
    base-url: ${APP_STORAGE_BASE_URL:https://api.openmarket.com/images}