logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.tool.schema: DEBUG  # ⭐ Shows DDL generation
    org.hibernate.tool.hbm2ddl: DEBUG # ⭐ Shows schema creation
    org.springframework.orm.jpa: DEBUG
    com.zaxxer.hikari: DEBUG

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true