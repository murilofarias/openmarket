spring:
  application:
    name: openmarket
  datasource:
    url: jdbc:postgresql://localhost:5432/openmarket
    username: openmarket_user
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  sql:
    init:
      mode: never

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/openmarket
          jwk-set-uri: http://localhost:8180/realms/openmarket/protocol/openid-connect/certs

server:
  port: 8080

# Logging configuration
logging:
  level:
    root: INFO
    com.example.openmarket: DEBUG
    # Log all exceptions from the exception handler
    com.example.openmarket.controller.exceptionHandler: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/openmarket.log
    max-size: 10MB
    max-history: 30

# Keycloak configuration for IdentityProvider
keycloak:
  server-url: http://localhost:8180
  realm: openmarket
  admin-username: admin
  admin-password: admin
  client-id: openmarket-api
  client-secret: openmarket-api-secret